[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cellmem-full-axis"
version = "0.1.0"
description = "Frozen full-axis count deconvolution with reference-donor mean precision"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = ["numpy==1.26.2", "scipy==1.11.4"]

[project.scripts]
cellmem-full-axis = "cellmem_full_axis.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

